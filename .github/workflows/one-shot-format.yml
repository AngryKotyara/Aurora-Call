name: One-shot native push format

on:
  push:
    paths:
      - ".github/workflows/one-shot-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format native push files
        run: npx prettier --write src/push-notifications.js supabase/functions/aurora-push/index.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/push-notifications.js supabase/functions/aurora-push/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format native push integration"
            git push origin HEAD:main
          fi
