name: Security and build
on:
  push:
    branches: [main, feat/photo-transfer-polish]
  pull_request:
permissions:
  contents: write
jobs:
  format-photo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/photo-transfer-polish' && !contains(github.event.head_commit.message, 'style: format photo transfer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/photo-transfer-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/photo-transfer-polish.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/photo-transfer-polish.css
          git commit -m "style: format photo transfer"
          git push origin HEAD:feat/photo-transfer-polish
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm run build
