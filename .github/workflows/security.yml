name: Security and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/photo-optimistic-handoff.js src/voice-playback-polish.js
      - name: Show formatted files
        run: |
          echo '===PHOTO===' 
          cat src/photo-optimistic-handoff.js
          echo '===VOICE===' 
          cat src/voice-playback-polish.js
          exit 1
