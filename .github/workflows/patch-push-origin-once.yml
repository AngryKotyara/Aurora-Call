name: Format backend functions once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply repository formatter
        run: |
          npx prettier --write \
            supabase/functions/aurora-auth/index.ts \
            supabase/functions/aurora-register-email/index.ts \
            supabase/functions/aurora-push/index.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- supabase/functions; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/aurora-auth/index.ts \
            supabase/functions/aurora-register-email/index.ts \
            supabase/functions/aurora-push/index.ts
          git commit -m "Format Aurora backend functions"
          git push
