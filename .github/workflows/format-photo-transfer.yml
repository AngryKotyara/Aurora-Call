name: Format photo transfer

on:
  push:
    branches:
      - feat/photo-transfer-polish

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: format photo transfer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/photo-transfer-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/photo-transfer-polish.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/photo-transfer-polish.css
          git commit -m "style: format photo transfer"
          git push origin HEAD:feat/photo-transfer-polish
