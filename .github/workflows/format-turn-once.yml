name: Format TURN edge function once

on:
  push:
    paths:
      - "supabase/functions/aurora-turn-credentials/index.ts"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Apply repository Prettier version
        run: npx prettier --write supabase/functions/aurora-turn-credentials/index.ts

      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- supabase/functions/aurora-turn-credentials/index.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/aurora-turn-credentials/index.ts
          git commit -m "Format TURN edge function with Prettier"
          git push
