name: Fix Android UI and push once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Patch Android push UX and server delivery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('android/app/src/main/java/app/auroracall/MainActivity.java')
          s = main.read_text()
          s = s.replace('AuroraCallAndroid/1.3"', 'AuroraCallAndroid/1.3.1"')
          main.write_text(s)

          client = Path('src/push-notifications.js')
          s = client.read_text()
          replacement = r'''function nativeCardCopy() {
            if (!nativePushState)
              return {
                title: "Проверяем уведомления",
                text: "Android сообщает состояние системных уведомлений.",
                action: "Проверка…",
                disabled: true,
                mode: "wait",
              };
            if (!nativePushState.distributor_available)
              return {
                title: "Нужен сервис доставки уведомлений",
                text: "Aurora Call работает без Google через UnifiedPush. Установите ntfy или Sunup, затем вернитесь в Aurora Call.",
                action: "Установить ntfy",
                disabled: false,
                mode: "unifiedpush_help",
              };
            if (
              nativePushState.registration_error === "temporary_unavailable" ||
              nativePushState.registration_error === "network"
            )
              return {
                title: "Сервис уведомлений временно недоступен",
                text: "Проверьте сеть и повторите подключение UnifiedPush.",
                action: "Повторить",
                disabled: false,
                mode: "enable",
              };
            if (nativePushState.user_enabled && !nativePushState.registered)
              return {
                title: "Подключите сервис уведомлений",
                text: nativePushState.distributor_selected
                  ? "Android ещё не выдал push-endpoint. Повторите регистрацию."
                  : "Выберите установленный UnifiedPush-сервис для Aurora Call.",
                action: "Подключить",
                disabled: false,
                mode: "enable",
              };
            if (nativePushState.enabled && !nativePushState.full_screen_allowed)
              return {
                title: "Фоновые уведомления включены",
                text: "Сообщения уже будут приходить. Разрешите полноэкранные уведомления, чтобы входящий звонок появлялся поверх экрана блокировки.",
                action: "Разрешить звонки",
                disabled: false,
                enabled: true,
                mode: "full_screen",
              };
            if (nativePushState.enabled)
              return {
                title: "Фоновые уведомления включены",
                text: "Aurora Call сможет сообщать о сообщениях и входящих звонках, даже когда приложение закрыто.",
                action: "Выключить уведомления",
                disabled: false,
                enabled: true,
                mode: "disable",
              };
            if (nativePushState.user_enabled)
              return {
                title: "Уведомления заблокированы Android",
                text: "Системное разрешение не выдано. Разрешите уведомления для Aurora Call и повторите подключение.",
                action: "Разрешить уведомления",
                disabled: false,
                mode: "enable",
              };
            return {
              title: "Уведомления о звонках и сообщениях",
              text: "Получайте системные уведомления Android без Firebase через UnifiedPush.",
              action: "Включить уведомления",
              disabled: false,
              mode: "enable",
            };
          }

          function cardCopy()'''
          s, count = re.subn(
              r'function nativeCardCopy\(\) \{.*?\n\}\n\nfunction cardCopy\(\)',
              replacement,
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('nativeCardCopy patch failed')
          needle = '    if (copy.mode === "ios_install") {'
          if needle not in s:
              raise SystemExit('push click patch failed')
          s = s.replace(
              needle,
              '    if (copy.mode === "unifiedpush_help") {\n'
              '      location.href = "https://unifiedpush.org/users/distributors/ntfy/";\n'
              '      return;\n'
              '    }\n'
              + needle,
              1,
          )
          client.write_text(s)

          backend = Path('supabase/functions/aurora-push/index.ts')
          s = backend.read_text()
          old = '          { TTL: ttl },'
          positions = [m.start() for m in re.finditer(re.escape(old), s)]
          if len(positions) < 2:
              raise SystemExit('native webpush options patch failed')
          pos = positions[1]
          s = s[:pos] + '          { TTL: ttl, headers: { "X-UnifiedPush": "1" } },' + s[pos + len(old):]
          backend.write_text(s)
          PY
      - run: npx prettier --write src/push-notifications.js supabase/functions/aurora-push/index.ts
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/app/auroracall/MainActivity.java src/push-notifications.js supabase/functions/aurora-push/index.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix Android notification setup UX"
          git push
