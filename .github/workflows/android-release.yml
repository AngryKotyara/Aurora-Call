name: Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Validate release secrets
        env:
          KEYSTORE: ${{ secrets.AURORA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "Missing AURORA_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing AURORA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing AURORA_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing AURORA_KEY_PASSWORD"; exit 1; }

      - name: Materialize release keystore
        env:
          KEYSTORE: ${{ secrets.AURORA_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/aurora-release.jks"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          AURORA_KEYSTORE_PATH: ${{ runner.temp }}/aurora-release.jks
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-call-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aurora-call-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
