name: Format photo handoff

on:
  push:
    branches:
      - fix/photo-handoff-persistent-preview

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: apply prettier') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/photo-handoff-persistent-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/photo-optimistic-handoff.js src/voice-playback-polish.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/photo-optimistic-handoff.js src/voice-playback-polish.js
          git commit -m "style: apply prettier"
          git push origin HEAD:fix/photo-handoff-persistent-preview
