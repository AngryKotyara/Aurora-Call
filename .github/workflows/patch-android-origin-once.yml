name: Patch Android origin once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use generated Android build origin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/java/app/auroracall/MainActivity.java')
          text = path.read_text()
          replacements = {
              'private static final String WEB_URL = "https://aurora-call.vercel.app";': 'private static final String WEB_URL = BuildConfig.AURORA_WEB_URL;',
              'private static final String TRUSTED_ORIGIN = "https://aurora-call.vercel.app";': 'private static final String TRUSTED_ORIGIN = BuildConfig.AURORA_TRUSTED_ORIGIN;',
              'private static final String TRUSTED_HOST = "aurora-call.vercel.app";': 'private static final String TRUSTED_HOST = BuildConfig.AURORA_TRUSTED_HOST;',
              'AuroraCallAndroid/1.1': 'AuroraCallAndroid/1.3',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Commit migration
        run: |
          if git diff --quiet -- android/app/src/main/java/app/auroracall/MainActivity.java; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/app/auroracall/MainActivity.java
          git commit -m "Use build-configured Android origin"
          git push
