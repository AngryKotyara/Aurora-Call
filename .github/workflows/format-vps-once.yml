name: Format VPS files once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write infra/vps/docker-compose.yml server/aurora.js server/vps.js
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- infra/vps/docker-compose.yml server/aurora.js server/vps.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/vps/docker-compose.yml server/aurora.js server/vps.js
          git commit -m "Format VPS runtime files"
          git push
