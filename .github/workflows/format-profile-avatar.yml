name: Format profile avatar branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format files reported by CI
        run: >-
          npx prettier --write
          index.html
          src/app.js
          src/profile-avatar.js
          src/chat-call-priority.js
          src/storage-media-hydrator.js
          test/mobile-compatibility.test.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/app.js src/profile-avatar.js src/chat-call-priority.js src/storage-media-hydrator.js test/mobile-compatibility.test.js
          git commit -m "style: format profile avatar changes"
          git push origin HEAD:${{ github.head_ref }}
