name: AuroraCall
options:
  bundleIdPrefix: app.auroracall
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  AuroraCall:
    type: application
    platform: iOS
    sources:
      - path: AuroraCall
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.auroracall
        PRODUCT_NAME: AuroraCall
        INFOPLIST_FILE: AuroraCall/Info.plist
        CODE_SIGN_ENTITLEMENTS: AuroraCall/AuroraCall.entitlements
        ENABLE_BITCODE: NO
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: "$(AURORA_APP_PROFILE)"
    dependencies:
      - target: AuroraCallBroadcast
        embed: true

  AuroraCallBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastUploadExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.auroracall.broadcast
        PRODUCT_NAME: AuroraCallBroadcast
        INFOPLIST_FILE: BroadcastUploadExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastUploadExtension/AuroraCallBroadcast.entitlements
        SKIP_INSTALL: YES
        ENABLE_BITCODE: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: "$(AURORA_BROADCAST_PROFILE)"
