plugins {
    id 'com.android.application'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def generatedAuroraIconResDir = file("$buildDir/generated/aurora-icon-res")
def signingAvailable = [
        System.getenv('AURORA_KEYSTORE_PATH'),
        System.getenv('AURORA_KEYSTORE_PASSWORD'),
        System.getenv('AURORA_KEY_ALIAS'),
        System.getenv('AURORA_KEY_PASSWORD')
].every { it != null && !it.isBlank() }

android {
    namespace 'app.auroracall'
    compileSdk 36

    defaultConfig {
        applicationId 'app.auroracall'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }

    sourceSets {
        main {
            res.srcDir generatedAuroraIconResDir
        }
    }

    signingConfigs {
        if (signingAvailable) {
            release {
                storeFile file(System.getenv('AURORA_KEYSTORE_PATH'))
                storePassword System.getenv('AURORA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AURORA_KEY_ALIAS')
                keyPassword System.getenv('AURORA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingAvailable) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('generateAuroraIcon', Copy) {
    from file('../../public/aurora-call-icon-512-v2.png')
    into file("$generatedAuroraIconResDir/drawable")
    rename { 'aurora_call_icon.png' }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn tasks.named('generateAuroraIcon')
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-messaging'
}
