plugins {
    id 'com.android.application'
}

def generatedAuroraIconResDir = file("$buildDir/generated/aurora-icon-res")
def signingAvailable = [
        System.getenv('AURORA_KEYSTORE_PATH'),
        System.getenv('AURORA_KEYSTORE_PASSWORD'),
        System.getenv('AURORA_KEY_ALIAS'),
        System.getenv('AURORA_KEY_PASSWORD')
].every { it != null && !it.isBlank() }

def auroraWebUrl = System.getenv('AURORA_WEB_URL') ?: 'https://aurora-call.vercel.app'
def auroraUri = new java.net.URI(auroraWebUrl)
if (auroraUri.scheme != 'https' || !auroraUri.host) {
    throw new GradleException('AURORA_WEB_URL must be an absolute HTTPS URL')
}
def auroraOrigin = "https://${auroraUri.host}${auroraUri.port > 0 ? ':' + auroraUri.port : ''}"
def javaString = { value ->
    '"' + String.valueOf(value).replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'app.auroracall'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'app.auroracall'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.3.0'
        buildConfigField 'String', 'AURORA_WEB_URL', javaString(auroraWebUrl)
        buildConfigField 'String', 'AURORA_TRUSTED_ORIGIN', javaString(auroraOrigin)
        buildConfigField 'String', 'AURORA_TRUSTED_HOST', javaString(auroraUri.host)
    }

    sourceSets {
        main {
            res.srcDir generatedAuroraIconResDir
        }
    }

    signingConfigs {
        if (signingAvailable) {
            release {
                storeFile file(System.getenv('AURORA_KEYSTORE_PATH'))
                storePassword System.getenv('AURORA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AURORA_KEY_ALIAS')
                keyPassword System.getenv('AURORA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingAvailable) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('generateAuroraIcon', Copy) {
    from file('../../public/aurora-call-icon-512-v2.png')
    into file("$generatedAuroraIconResDir/drawable")
    rename { 'aurora_call_icon.png' }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn tasks.named('generateAuroraIcon')
}

configurations.configureEach {
    def tink = 'com.google.crypto.tink:tink-android:1.20.0'
    resolutionStrategy {
        force tink
        dependencySubstitution {
            substitute module('com.google.crypto.tink:tink') using module(tink)
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation 'org.unifiedpush.android:connector:3.3.5'
}
